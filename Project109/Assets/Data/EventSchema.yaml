# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"
useItem: &use_items
  type: object
  itemType:
    type: string
    enum:
    - Money
    - MaxHp
    - Hp
    - SpecificCard
    - RandomCard
    - SpecificRelic
    - RandomRelic
    value:
      type: integer
    name:
      type: string

getItem: &get_items
  type: object
  itemType:
    type: string
    enum:
    - Money
    - MaxHp
    - Hp
    - SpecificCard
    - CardReward
    - SpecificRelic
    - RelicReward
    - Battle
    - Event
    value:
      type: integer
    name:
      type: string

choice: &choice_data
  type: object
  properties:
    description:
      type: string
    useItems:
      type: array
      item:
        <<: *use_items
    getItems:
      type: array
      item:
        <<: *get_items

condition: &appear_condition
  type: object
  conditionType:
    type: string
    enum:
    - None
    - CurrentHp
    - CurrentMoney
    - Playtime
  value:
    type: integer

type: object
properties:
  eventCollection:
    type: array
    items:
      type: object
      properties:
        eventAppearLevel:
          type: integer
          minimum: !!int 1
          maximum: !!int 3
        eventAppearCondition:
          type: array
          item:
            <<: *appear_condition
        eventObjectPath:
          type: string
        eventName:
          type: string
        eventDescription:
          type: string
        choices:
          type: array
          item:
            <<: *choice_data
      required:
        - eventAppearLevel
        - eventAppearCondition
        - eventObjectPath
        - eventName
        - eventDescription 
        - choices
required:
  - eventCollection    