# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"
monster: &monster_info
  type: object
  monsterName:
    type: string
  spawnPointX:
    type: integer
    minimum: !!int 0
  spawnPointY:
    type: integer
    minimum: !!int 0

type: object
properties:
  battleMonsterCollection:
    type: array
    items:
      type: object
      properties:
        battleDataName:
          type: string
        dataPath:
          type: string
        battleAppearLevel:
          type: integer
          minimum: !!int 1
          maximum: !!int 3
        monsterAppearInformation:
          type: array
          item:
            <<: *monster_info
      required:
        - battleDataName
        - battleAppearLevel
        - monsterAppearInformation
required:
  - battleMonsterCollection    