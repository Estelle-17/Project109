# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
# 처음으로 보여줄 스테이지의 stageID는 "START"로 통일
eventCollection:
  - eventID: Mystery_Tombstone_Data
    eventAppearLevel: !!int 1
    eventAppearCondition:
      - conditionType: None
        value: 0
    eventObjectPath: NPC_Event_Tombstone_Model
    stages:
      - stageID: "START"
        stageDescription: 수상하게 생긴 비석이 눈앞에 보입니다...
        choices:
          - description: 주변을 살펴본다
            nextStageID: END_GETMONEY
            luaScript: MysteryTombstone_LookAround
          - description: 기도한다
            nextStageID: END_GETCARD
            luaScript: MysteryTombstone_Pray

      - stageID: "END_GETMONEY"
        stageDescription: 수상한 비석을 무시한 채 주변의 반짝이는 것들을 주워서 지나갔습니다...
        choices:
          - description: 확인
            nextStageID: null
      
      - stageID: "END_GETCARD"
        stageDescription: "수상한 비석에 돈을 던진 후 기도하였습니다.\n그러자 비석은 만족한듯이 카드를 한장 보여줍니다."
        choices:
          - description: 확인
            nextStageID: null

  
  - eventID: Event_Test_Data
    eventAppearLevel: !!int 1
    eventAppearCondition:
      - conditionType: None
        value: 0
    eventObjectPath: NPC_Event_Tombstone_Model
    stages:
    - stageID: "START"
      stageDescription: 이벤트 테스트 진행중
      choices:
        - description: 돈 획득
          nextStageID: END_TEST
          luaScript: EventTest_GetMoney
        - description: 재화를 사용하여 카드 획득
          nextStageID: END_TEST
          luaScript: EventTest_GetCardWithGold
        - description: 랜덤한 카드를 소모하여 골드 획득
          nextStageID: END_TEST
          luaScript: EventTest_LoseCardGetGold
        - description: 랜덤한 유물를 소모하여 골드 획득
          nextStageID: END_TEST
          luaScript: EventTest_LoseRelicGetGold
        - description: 전투 진행
          nextStageID: BATTLE
          luaScript: EventTest_Battle
        - description: 무시한다
          nextStageID: END_TEST

    - stageID: "END_TEST"
      stageDescription: 선택지 선택 완료. 테스트 종료
      choices:
        - description: 진행한다.
          nextStageID: null

    - stageID: "BATTLE"
      stageDescription: 특정 전투를 진행합니다.
      choices:
        - description: 전투 시작!
          nextStageID: null
          luaScript: EventTest_Battle

  - eventID: Insight_Event_Data
    eventAppearLevel: !!int 4
    eventAppearCondition:
      - conditionType: None
        value: 0
    eventObjectPath: NPC_Event_Tombstone_Model
    stages:
      - stageID: "START"
        stageDescription: "신단이 당신에게 다가와 속삭입니다.\n
                          \"약간의 골드가 있다면 당신의 여정에 도움이 될 수 있도록 내가 빛을 비춰줄게요.\"\n\n
                          신단의 제안을 받아들이시겠습니까?"
        choices:
          - description: 받아드린다.
            nextStageID: END_PROCESS
            luaScript: InsightEvent_Accept
          - description: 무시한다.
            nextStageID: null

      - stageID: "END_PROCESS"
        stageDescription: "신단이 점점 빛으로 둘러싸이더니 자신의 소지품으로 빛이 들어옵니다.\n
                           이후 활기가 웃돌며 목표가 뚜렷해지는 느낌을 받습니다."
        choices:
          - description: 지나간다.
            nextStageID: null

  - eventID: Lake_Event_Data
    eventAppearLevel: !!int 1
    eventAppearCondition:
      - conditionType: None
        value: 0
    eventObjectPath: NPC_Event_Tombstone_Model
    stages:
      - stageID: "START"
        stageDescription: "눈앞에 방을 가득 채운 호수가 보입니다.\n
                          호수는 밝게 빛나고 있었으며, 들어가도 괜찮다고 느껴집니다."
        choices:
          - description: 호수에 몸을 담군다.
            nextStageID: END_LAKE_PROCESS
            luaScript: LakeEvent_Bath
          - description: 근처의 물건들을 줍는다.
            nextStageID: null

      - stageID: "END_LAKE_PROCESS"
        stageDescription: "빛이 나는 호수에 몸을 담구자, 청량한 감각이 몸을 스칩니다."
        choices:
          - description: 지나간다.
            nextStageID: null
      
      - stageID: "END_PASS_PROCESS"
        stageDescription: "수상한 돌을 줍고 확인해보니 금화였습니다!\n
                            당신은 주변의 금화들을 줍고 빛나는 호수를 지나칩니다."
        choices:
          - description: 지나간다.
            nextStageID: null

  - eventID: Suspicious_Door_Event_Data
    eventAppearLevel: !!int 1
    eventAppearCondition:
      - conditionType: None
        value: 0
    eventObjectPath: NPC_Event_Tombstone_Model
    stages:
      - stageID: "START"
        stageDescription: "작은 방에 수상한 문이 두 개가 있습니다...\n
                          한 쪽 문은 약한 흰색 빛을 내고 있었으며, 다른 한 쪽은 검은색 연기가 흘러나오고 있습니다.\n
                          다른 문은 보이지 않기에 한 곳을 선택하여 지나가야 할 것 같습니다."
        choices:
          - description: 약한 빛이 나는 문으로 간다.
            nextStageID: END_LESS_LIGHT_PROCESS
            luaScript: SuspiciousDoor_Light
          - description: 검은색 연기가 흐르는 문으로 간다.
            nextStageID: END_DARK_SMOKE_PROCESS
            luaScript: SuspiciousDoor_Dark

      - stageID: "END_LESS_LIGHT_PROCESS"
        stageDescription: "약한 빛이 나오는 문을 열고 들어가자, 빛이 당신의 몸을 감싸기 시작했습니다.\n
                          잠시 후 정신을 차리자 몸을 감싼 빛은 눈치채기도 전에 사라져 있었습니다.\n
                          눈 깜짝할 사이에 벌어진 일이였지만, 자신의 몸은 좀 더 활기가 돈다는 것을 알게 되었습니다."
        choices:
          - description: 지나간다.
            nextStageID: null
      
      - stageID: "END_DARK_SMOKE_PROCESS"
        stageDescription: "문을 열자, 어두운 연기가 당신의 몸을 감싸기 시작했으며 그 연기는 생각보다 고통스러웠습니다...\n
                          시간이 흐르고 연기가 사라진 자리에는 특별한 유물 하나가 보입니다.\n
                          분명 문을 연 자의 자신감에 대한 보상이겠지요."
        choices:
          - description: 지나간다.
            nextStageID: null

  - eventID: Ancient_Library_Event_Data
    eventAppearLevel: !!int 1
    eventAppearCondition:
      - conditionType: None
        value: 0
    eventObjectPath: NPC_Event_Tombstone_Model
    stages:
      - stageID: "START"
        stageDescription: "길을 가던 중 오래된 수많은 책과 종이가 가득한 책장들이 가득한 곳을 발견했습니다.\n
                          안은 생각보다 아늑했으며, 다양한 지식들이 가득한 책과 종이들이 가득했습니다.\n
                          신기하게도 사람의 흔적은 보이지 않습니다."
        choices:
          - description: 여러 정보들을 수집한다.
            nextStageID: END_TAKE_INFOMATION_PROCESS
            luaScript: AncientLibrary_Collect
          - description: 휴식한다
            nextStageID: END_REST_PROCESS
            luaScript: AncientLibrary_Rest
          - description: 찻장을 살펴본다
            nextStageID: END_FIND_POTION_PROCESS
            luaScript: AncientLibrary_Potion

      - stageID: "END_TAKE_INFOMATION_PROCESS"
        stageDescription: "당신은 던전, 기억, 전투, 생활 등 다양한 정보들의 집합체가 이곳에 있다는 것이 신기합니다.\n
                          던전 안의 신비한 정보들은 어디서 남겨둔 것일까요?"
        choices:
          - description: 지나간다.
            nextStageID: null
      
      - stageID: "END_REST_PROCESS"
        stageDescription: "정보에는 관심이 없는 당신은 편한 곳에 몸을 두고 휴식합니다...\n
                          시간이 흐른 후 가벼운 발걸음으로 이곳을 떠납니다."
        choices:
          - description: 지나간다.
            nextStageID: null

      - stageID: "END_FIND_POTION_PROCESS"
        stageDescription: "다른 곳에 관심이 생긴 당신은 구석진 곳의 찻장을 뒤져봅니다.\n
                          특별히 사용 가능한 포션들이 눈에 보인 당신은 가방에 넣고 이곳을 떠납니다..."
        choices:
          - description: 지나간다.
            nextStageID: null

  - eventID: Altar_Upgrade_Event_Data
    eventAppearLevel: !!int 1
    eventAppearCondition:
      - conditionType: None
        value: 0
    eventObjectPath: NPC_Event_Tombstone_Model
    stages:
      - stageID: "START"
        stageDescription: "방에 수상해 보이는 제단을 발견했습니다."
        choices:
          - description: 다가가서 만져본다.
            nextStageID: END_TAKE_PROCESS
            luaScript: AltarUpgrade_Touch
          - description: 지나간다.
            nextStageID: END_PASS_PROCESS

      - stageID: "END_TAKE_PROCESS"
        stageDescription: "제단을 만지자 이상한 느낌이 들고 제단은 순식간에 무너졌습니다.\n
                          찜찜하지만 부셔진 제단은 두고 가던 길로 지나갑니다."
        choices:
          - description: 지나간다.
            nextStageID: null
      
      - stageID: "END_PASS_PROCESS"
        stageDescription: "수상한 물건을 굳이 만질 필요는 없죠."
        choices:
          - description: 지나간다.
            nextStageID: null

  - eventID: Altar_Erase_Event_Data
    eventAppearLevel: !!int 1
    eventAppearCondition:
      - conditionType: None
        value: 0
    eventObjectPath: NPC_Event_Tombstone_Model
    stages:
      - stageID: "START"
        stageDescription: "방에 수상해 보이는 제단을 발견했습니다."
        choices:
          - description: 다가가서 만져본다.
            nextStageID: END_TAKE_PROCESS
            luaScript: AltarErase_Touch
          - description: 지나간다.
            nextStageID: END_PASS_PROCESS

      - stageID: "END_TAKE_PROCESS"
        stageDescription: "제단을 만지자 이상한 느낌이 들고 제단은 순식간에 무너졌습니다.\n
                          찜찜하지만 부셔진 제단은 두고 가던 길로 지나갑니다."
        choices:
          - description: 지나간다.
            nextStageID: null
      
      - stageID: "END_PASS_PROCESS"
        stageDescription: "수상한 물건을 굳이 만질 필요는 없죠."
        choices:
          - description: 지나간다.
            nextStageID: null

  - eventID: Altar_Gold_Event_Data
    eventAppearLevel: !!int 1
    eventAppearCondition:
      - conditionType: None
        value: 0
    eventObjectPath: NPC_Event_Tombstone_Model
    stages:
      - stageID: "START"
        stageDescription: "방에 수상해 보이는 제단을 발견했습니다.\n
                          제단 위에는 커다란 황금이 올려져 있으며, 주변에도 금화가 떨어져 있습니다."
        choices:
          - description: 황금을 들고간다.
            nextStageID: END_TAKE_GOLD_PROCESS
            luaScript: AltarGold_TakeGold
          - description: 바닥의 금화들을 줍는다.
            nextStageID: END_PICKUP_GOLD_PROCESS
            luaScript: AltarGold_PickUpGold

      - stageID: "END_TAKE_GOLD_PROCESS"
        stageDescription: "제단 위의 황금을 들어올리자, 제단에서 보라색의 연기가 빠르게 퍼져나갑니다.\n
                          당신은 연기가 방을 채우기 전에 재빠르게 방에서 탈출하였지만, 몸 상태가 좋지는 않아 보이네요.\n
                          약간의 후회를 가진 채 자리를 떠났습니다."
        choices:
          - description: 지나간다.
            nextStageID: null
      
      - stageID: "END_PICKUP_GOLD_PROCESS"
        stageDescription: "함정같은 물건을 손쉽게 만지지 않는 것이 좋아보입니다.\n
                          당신은 욕심내지 않고 주변의 금화를 주운 후 제단을 지나갑니다."
        choices:
          - description: 지나간다.
            nextStageID: null