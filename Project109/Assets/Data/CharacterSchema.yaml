# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"
card: &cards
  type: object
  cardName:
      type: string
  number:
    type: integer
    minimum: 0

type: object
properties:
  characterCollection:
    type: array
    items:
      type: object
      properties:
        classType:
          type: string
          enum:
          - Warrior
          - Hunter
        characterName:
          type: string
        modelingPath:
          type: string
        description:
          type: string
        hp:
          type: number
        stamina:
          type: number
        staminaRegen:
          type: number
        strength:
          type: integer
        armor:
          type: integer
        startRelic:
          type: array
          items:
            type: string
        startCards:
          type: array
          items:
            <<: *cards

      required:
        - classType
        - characterName
        - modelingPath
        - description
        - hp
        - stamina
        - staminaRegen
        - strength
        - armor
        - startRelic
        - startCards
required:
  - characterCollection    