# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"
keyValueData: &key_value
  type: object
  key:
    type: string
    enum:
    - Card
    - Relic
    - Event
    - BattleNode
    - Monster
    - Character
    - Model
  bundlePath:
    type: string

type: object
properties:
  mod_catalog:
    type: array
    items:
      type: object
      properties:
        assetData:
          type: array
          item:
            <<: *key_value
      required:
        - assetData