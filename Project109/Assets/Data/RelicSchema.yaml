# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"
effect: &relic_effect
  type: object
  effectType:
      type: string
      enum:
      - None
      - Damage
      - Heal
      - Buff
      - Debuff
      - Move
  value:
    type: integer
    minimum: 0

condition: &relic_condition
  type: object
  conditionType:
    type: string
  value:
    type: integer

type: object
properties:
  relicCollection:
    type: array
    items:
      type: object
      properties:
        classType:
          type: string
          enum:
          - All
          - Warrior
          - Hunter
        relicName:
          type: string
        texturePath:
          type: string
        dataPath:
          type: string
        rarity:  # 유물 희귀도
          type: integer
          minimum: !!int 1
          maximum: !!int 4
        canUpgrade:
          type: boolean
        description:
          type: string
        upgradeDescription:
          type: string
      required:
        - classType
        - relicName
        - rarity
        - canUpgrade
        - description
        - upgradeDescription
required:
  - relicCollection    