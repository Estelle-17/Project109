# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"

type: object
properties:
  monsterCollection:
    type: array
    items:
      type: object
      properties:
        monsterType:
          type: string
          enum:
          - Normal
          - Elite
          - Boss
        monsterName:
          type: string
        objectPath:
          type: string
        appearLevel:  # 등장 스테이지
          type: integer
          minimum: !!int 1
          maximum: !!int 3
        hp:
          type: number
        stamina:
          type: number
        staminaRegen:
          type: number
        strength:
          type: integer
        armor:
          type: integer
      required:
        - monsterType
        - monsterName
        - objectPath
        - appearLevel 
        - hp
        - stamina
        - staminaRegen
        - strength
        - armor
required:
  - monsterCollection    