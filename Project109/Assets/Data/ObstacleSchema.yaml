# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"

type: object
properties:
  obstacleCollection:
    type: array
    items:
      type: object
      properties:
        obstacleName:
          type: string
        objectPath:
          type: string
        dataPath:
          type: string
        hp:
          type: number
      required:
        - obstacleName
        - objectPath
        - dataPath
        - hp
required:
  - obstacleCollection    