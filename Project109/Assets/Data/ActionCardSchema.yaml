# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"

additionalEffectArea: &additionalEffectArea
  type: object
  areaType:
    type: string
  distance:
    type: integer
  required:
    - areaType
    - distance

type: object
properties:
  cardCollection:
    type: array
    items:
      type: object
      properties:
        path:
          type: string
        className:
          type: string
          enum:
          - Warrior
          - Hunter
        cardName:
          type: string
        bIsUpgradeCard:
          type: boolean        
        rarity:  # 카드 희귀도
          type: integer
          minimum: !!int 1
          maximum: !!int 3
        stamina:
          type: integer
        cardType:
          type: string
          enum:
          - Attack
          - Skill
          - Utility
        targetType:
          type: string
          enum:
          - All
          - Target
          - Area
        targetMinDistance:
          type: integer
        targetMaxDistance:
          type: integer
        additionalEffectAreaList:
          type: array
          items:
            <<: *additionalEffectArea
        amountList:
          type: array
          items:
            type: integer
        upgradeCardPath:
          type: string
        maxMasteryPoint:
          type: integer
        specificProperties:
          type: array
          items:
            type: integer
        texturePath:
          type: string
      required:
        - path
        - className
        - cardName
        - bIsUpgradeCard        
        - rarity
        - stamina
        - cardType
        - targetType
        - targetMinDistance
        - targetMaxDistance
        - additionalEffectAreaList
        - amountList
        - texturePath
required:
  - cardCollection