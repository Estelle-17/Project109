# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"

type: object
properties:
  monsterRewardCollection:
    type: array
    items:
      type: object
      properties:
        monsterName:
          type: string
        minDropGoldAmount:
          type: integer
        maxDropGoldAmount:
          type: integer
        # 몬스터 드랍 보상 테이블은 이곳에 더 추가할 수 있음
      required:
        - monsterName
required:
  - monsterRewardCollection    