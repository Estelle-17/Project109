# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"

type: object
properties:
  cardCollection:
    type: array
    items:
      type: object
      properties:
        path:
          type: string
        className:
          type: string
          enum:
          - Warrior
          - Hunter
        cardName:
          type: string
        rarity:  # 카드 희귀도
          type: integer
          minimum: !!int 1
          maximum: !!int 3
        stamina:
          type: integer
        cardType:
          type: string
          enum:
          - Attack
          - Skill
          - Utility
        targetType:
          type: string
          enum:
          - All
          - Target
          - Random
        effectArea:
          type: array
          items:
            type: string
            pattern: "^[01]{5}$"
            minItems: !!int 5
            maxItems: !!int 5
        amountList:
          type: array
          items:
            type: integer
        upgradeAmountList:
          type: array
          items:
            type: integer
        maxMasteryPoint:
          type: integer
        texturePath:
          type: string
      required:
        - path
        - className
        - cardName
        - rarity      
        - stamina
        - cardType
        - targetType
        - effectArea
        - amountList
        - upgradeAmountList
        - texturePath
required:
  - cardCollection