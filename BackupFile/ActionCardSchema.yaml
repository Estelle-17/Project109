# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"
conditional_effect: &conditional_effect
  type: object
  properties:
    condition:
      type: object
      properties:
        conditionType:
          type: string
          enum:
          - None
          - TargetHealthRatio #대상 체력 비율
          - SelfBuffCount #자신의 버프 갯수
          - SelfFrenzyCount  #자신의 광분 갯수
          - PerFrenzyBuff  #자신의 광분 버프 1개 당 값
          - IsPoison  #대상의 독 상태
          - IsDeadlyPoision #대상의 맹독 상태    
          - IsBleeding  #대상의 출혈 상태
          - IsDebilitating  #대상의 쇠약 상태
          - IsWeaken  #대상의 약화 상태
        value:
          type: number
        description:
          type: string
    required:
      - conditionType
      - value
      - description
    effectOverride:
      type: object
      properties:
        baseValue:
          type: number
        staminaValue:
          type: number
        damageRatio:
          type: number
        scalingRatio:
          type: number
        targetMode:
          type: string
          enum:
          - All
          - Target
          - Random
          - Self
        times:
          type: number
          minimum: 0
        statusEffectType:
          type: string
          enum:
          - None
          - Strength
          - Armor
          - Bleeding  #출혈
          - Poison  #독
          - DeadlyPoision #맹독
          - Debilitate  #쇠약
          - weaken  #약화
          - Frenzy  #폭주
        durationTime:
          type: integer
          minimum: 0
      minProperties: 1
required:

effect: &skill_effect
  type: object
  effectType:
      type: string
      description: "적용될 효과의 타입"
      enum:
      - None
      - Damage
      - Heal
      - Shield
      - TemporaryShield
      - Buff
      - Debuff
      - Move
  baseValue:
    type: number
    minimum: 0
  scalingStat:
    type: string
    description: "효과량 계산에 사용될 캐릭터 스탯"
    enum:
    - None
    - Strength
    - Armor
    - MaxHp
    - CurrentHp
  scalingRatio:
    type: number
    description: "scalingStat이 효과에 기여하는 비율(1.0은 스탯의 100%를 반영함)"
    minimum: 0
  targetMode:
    type: string
    description: "타겟을 어떤 방식으로 찾을 것인지"
    enum:
    - All
    - Target
    - Random
    - Self
  times:
    type: number
    description: "효과가 적용되는 횟수"
    minimum: 0
  statusEffectType:
    type: string
    description: "상단의 effectType이 Buff/Debuff일 경우 적용될 상태 효과 타입"
    enum:
    - None
    - Strength
    - Armor
    - Bleeding  #출혈
    - Poison  #독
    - DeadlyPoision #맹독
    - Debilitate  #쇠약
    - Weaken  #약화
  durationTime:
    type: integer
    minimum: 0
  conditionalEffect:
    type: array
    items:
      <<: *conditional_effect
required:
- effectType
- baseValue
- scalingStat
- scalingRatio
- targetMode
- times

condition: &skill_condition
  type: object
  conditionType:
    type: string
    description: "조건 발동 타입"
    enum:
    - None
    - HealthRatio #대상 체력 비율
    - BuffCount #자신의 버프 갯수
    - IsPoison  #대상의 독 상태
    - IsDeadlyPoision #대상의 맹독 상태    
    - IsBleeding  #대상의 출혈 상태
    - IsDebilitating  #대상의 쇠약 상태
    - IsWeaken  #대상의 약화 상태
  target:
    type: string
    enum:
    - Target
    - Self
  value:
    type: number
  description:
    type: string
required:
  - conditionType
  - value
  - description

cardFeatures: &card_features
  type: object
  cardFeatureType:
    type: string
    description: "카드의 특성 타입들"
    enum:
      - None
      - Start_Action    #패에 들어왔을 시 바로 사용
      - Vanguard        #턴의 가장 처음으로 사용되면 보너스 효과
      - Finale          #턴이 종료되었을 때 손에 있을 경우 남은 스태미너를 전부 소모하여 스태미너 X당 한 번 씩 사용됨
      - Echo            #이번 턴에 카드 사용 시 연속으로 사용 가능하지만 사용 할 때마다 비용 증가
      - Single_use      #이번 전투에서 한 번만 사용 가능
      - Destroy         #카드를 사용한 후 덱에서 없어짐
      - Divide          #카드를 사용하면 두 장으로 늘어난 후 카드 무덤으로 이동
      - Chain           #스태미너를 N만큼 더 소모한다면 추가로 효과가 발동함
      - Unavailable     #카드를 직접 사용할 수 없음
  description:
    type: string
  featureValue:
    type: number
    description: "특성에 따라 다르게 사용되는 값 (Echo 사용 시 증가되는 스태미너량 등)"
  bonusEffect:
    type: array
    items:
      <<: *conditional_effect
  chainStaminaCost:
    type: integer
    description: "Chain발동 시 추가로 소모되는 스태미너량"
    default: 0
  chainEffect:
    type: array
    items:
      <<: *skill_effect
  chainCondition:
    type: array
    items:
      <<: *skill_condition

area: &effect_area
  type: object
  area:
      type: array
      items:
        type: string
        pattern: "^[01]{5}$"
        minItems: 5
        maxItems: 5

cardEffect: &card_effect
  type: object
  effectArea:
    type: array
    items:
      type: string
      pattern: "^[01]{5}$"
      minItems: 5
      maxItems: 5
  useStamina:
    type: integer
    minimum: !!int 0
  conditions:
    type: array
    items:
      <<: *skill_condition
  effects:
    type: array
    items:
      <<: *skill_effect
  features:
    type: array
    items:
      <<: *card_features
required:
- effectArea
- useStamina
- conditions
- effects
- features

type: object
properties:
  cardCollection:
    type: array
    items:
      type: object
      properties:
        className:
          type: string
          enum:
          - Warrior
          - Hunter
        cardName:
          type: string
        texturePath:
          type: string
        dataPath:
          type: string
        level:  # 카드 희귀도
          type: integer
          minimum: !!int 1
          maximum: !!int 3
        defaultEffects:
          type: object
          items:
            <<: *card_effect
        upgradeEffects:
          type: object
          items:
            <<: *card_effect
        
      required:
        - className
        - cardName
        - texturePath
        - dataPath
        - level
        - defaultEffects
        - upgradeEffects
required:
  - cardCollection    