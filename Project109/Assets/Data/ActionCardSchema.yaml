# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"
effect: &skill_effect
  type: object
  effectType:
      type: string
      enum:
      - None
      - Damage
      - Heal
      - Shield
      - Buff
      - Debuff
      - Move
  value:
    type: number
    minimum: 0
  times:
    type: number
    minimum: 0

condition: &skill_condition
  type: object
  conditionType:
    type: string
  value:
    type: integer
  description:
    type: string

cardFeatures: &card_features
  type: object
  cardFeatureType:
    type: string
    enum:
      - None
      - Start_Action    #패에 들어왔을 시 바로 사용
      - Vanguard        #턴의 가장 처음으로 사용되면 보너스 효과
      - Finale          #턴이 종료되었을 때 손에 있을 경우 남은 스태미너를 전부 소모하여 스태미너 X당 한 번 씩 사용됨
      - Echo            #이번 턴에 카드 사용 시 연속으로 사용 가능하지만 사용 할 때마다 비용 증가
      - Single_use      #이번 전투에서 한 번만 사용 가능
      - Destroy         #카드를 사용한 후 덱에서 없어짐
      - Divide          #카드를 사용하면 두 장으로 늘어난 후 카드 무덤으로 이동
      - Chain           #스태미너를 N만큼 더 소모한다면 강화된 효과로 발동
  chainEffect:
    type: array
    items:
      <<: *skill_effect
  chainCondition:
    type: array
    items:
      <<: *skill_condition

cardEffect: &card_effect
  type: object
  effects:
    type: array
    items:
      <<: *skill_effect
  conditions:
    type: array
    items:
      <<: *skill_condition
  features:
    type: array
    items:
      <<: *card_features

area: &effect_area
  type: object
  area:
      type: array
      items:
        type: string


type: object
properties:
  cardCollection:
    type: array
    items:
      type: object
      properties:
        className:
          type: string
          enum:
          - Warrior
          - Hunter
        cardName:
          type: string
        texturePath:
          type: string
        level:  # 카드 희귀도
          type: integer
          minimum: !!int 1
          maximum: !!int 3
        useStamina:
          type: integer
          minimum: !!int 0
        effectArea:
          type: array
          items:
            <<: *effect_area
        defaultEffects:
          type: object
          items:
            <<: *card_effect
        upgradeEffects:
          type: object
          items:
            <<: *card_effect
        
      required:
        - className
        - cardName
        - texturePath
        - level
        - useStamina
        - effectArea
        - defaultEffects
        - upgradeEffects
required:
  - cardCollection    