# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"
map_variations: &map_variations
  type: object
  properties:
    variationName:
      type: string
    obstacleLayout:
      type: array
      items:
        type: string
        pattern: "^[.NO]+$"  # .(점) : 빈 공간, N : NPC위치, O : 장애물, E : 적 위치
required:
- variationName
- obstacleLayout  

type: object
properties:
  mapCollection:
    type: array
    items:
      type: object
      properties:
        mapName:
          type: string
        dataPath:
          type: string
        baseLayout:
          type: array
          items:
            type: string
            pattern: "^[01SRC]+$"  # 0: 이동 가능, 1: 이동 불가능, 2: 보상 생성 위치
        variations:
          type: array
          items:
            <<: *map_variations
      required:
        - mapName
        - baseLayout
        - variations
required:
  - mapCollection    