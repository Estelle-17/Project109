# string이 아닌 int, float, bool형식은 !!int와 같이 변수의 타입을 강제 지정해주어야 문제가 안생김
$schema:  "https://json-schema.org/draft/2020-12/schema"

type: object
properties:
  trapCollection:
    type: array
    items:
      type: object
      properties:
        trapName:
          type: string
        objectPath:
          type: string
        dataPath:
          type: string
        hp:
          type: number
        damage:
          type: number
        attackCount:
          type: integer
      required:
        - trapName
        - objectPath
        - dataPath
        - hp
        - damage
        - attackCount
required:
  - trapCollection    